<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Travel India</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e90ff, #87cefa);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .login-box h2 {
      color: #333;
      margin-bottom: 25px;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #1e90ff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-box button:hover {
      background-color: #0c7cd5;
    }

    .login-box .links {
      margin-top: 15px;
    }

    .login-box .links a {
      display: block;
      color: #555;
      text-decoration: none;
      font-size: 14px;
      margin-top: 5px;
    }

    .login-box .links a:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login to Travel India</h2>
    <!-- This form will redirect to nextpage.html after "login" -->
    <form action="nextpage.html" method="get">
      <input type="text" placeholder="Username or Email" name="username" required>
      <input type="password" placeholder="Password" name="password" required>
      <button><a href="a2.html">Login</a></button>
    </form>
    
  </div>

</body>
</html>
