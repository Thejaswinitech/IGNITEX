<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uber Account</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff;
    }
    .header {
      background: #fbbc05;
      color: #000;
      padding: 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .container {
      padding: 16px;
    }
    .profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    .profile-text h2 {
      margin: 0;
    }
    .rating {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }
    .rating img {
      width: 14px;
      height: 14px;
      margin-right: 4px;
    }
    .profile img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
    }
    .option {
      display: flex;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }
    .option img {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      margin-top: 2px;
    }
    .option-text {
      flex: 1;
    }
    .option-text p {
      margin: 0;
    }
    .option-text .sub {
      color: #777;
      font-size: 13px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #fff;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid #ccc;
    }
    .bottom-nav div {
      text-align: center;
      font-size: 12px;
    }
    .bottom-nav img {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>

  <div class="header">
    Location sharing disabled. Tap here to enable
  </div>

  <div class="container">
    <div class="profile">
      <div class="profile-text">
        <h2>YASHASWINI</h2>
        <h3>Yashi</h3>
        <div class="rating">
          <img src="star-icon.png" alt="star">
          <span>5.0</span>
        </div>
      </div>
      <img src="user-icon.png" alt="user">
    </div>

    <div class="option"><img src="settings-icon.png"><div class="option-text"><p>Settings</p></div></div>
    <div class="option"><img src="umbrella-icon.png"><div class="option-text"><p>Rider insurance</p><p class="sub">₹10L cover for ₹3/trip</p></div></div>
    <div class="option"><img src="message-icon.png"><div class="option-text"><p>Messages</p></div></div>
    <div class="option"><img src="gift-icon.png"><div class="option-text"><p>Send a gift</p></div></div>
    <div class="option"><img src="earn-icon.png"><div class="option-text"><p>Earn by driving or delivering</p></div></div>
    <div class="option"><img src="briefcase-icon.png"><div class="option-text"><p>Set up your business profile</p><p class="sub">Automate work travel & meal expenses</p></div></div>
    <div class="option"><img src="refer-icon.png"><div class="option-text"><p>Refer friends, unlock deals</p></div></div>
    <div class="option"><img src="account-icon.png"><div class="option-text"><p>Manage Uber account</p></div></div>
    <div class="option"><img src="info-icon.png"><div class="option-text"><p>Legal</p></div></div>
  </div>

 </body>
</html>
