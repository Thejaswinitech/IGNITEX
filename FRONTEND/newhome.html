<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Mithra</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      color: white;
      margin-bottom: 40px;
      font-size: 3em;
    }

    .container {
      display: flex;
      gap: 40px;
    }

    .image-box {
      cursor: pointer;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }

    .image-box:hover {
      transform: scale(1.05);
    }

    .image-box img {
      width: 300px;
      height: 200px;
      object-fit: cover;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 2;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-content {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      width: 80%;
      max-width: 500px;
      margin: 15% auto;
      text-align: center;
      animation: fadeIn 0.4s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .close {
      float: right;
      font-size: 24px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
    }

    .close:hover {
      color: #000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<h1>Travel Mithra</h1>

<div class="container">
  <div class="image-box" onclick="openModal('flight')">
    <img src="https://i.imgur.com/HF5DN3P.jpg" alt="Flight">
  </div>
  <div class="image-box" onclick="openModal('train')">
    <img src="https://i.imgur.com/UfP8nON.jpg" alt="Train">
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle">Title</h2>
    <p id="modalContent">Content goes here.</p>
  </div>
</div>

<script>
  function openModal(type) {
    const modal = document.getElementById('modal');
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');

    if (type === 'flight') {
      title.innerText = 'Flight Information';
      content.innerText = 'Explore flight schedules, airfares, and real-time updates with Travel Mithra.';
    } else if (type === 'train') {
      title.innerText = 'Train Information';
      content.innerText = 'Check train timings, seat availability, and booking options easily.';
    }

    modal.style.display = 'block';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  window.onclick = function(event) {
    const modal = document.getElementById('modal');
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  }
</script>

</body>
</html>
