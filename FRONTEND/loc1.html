    <script>
        document.getElementById("travelForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const cname = document.getElementById("currentLocation").value.toUpperCase();
            const dname = document.getElementById("destinationLocation").value.toUpperCase();
            const classChoice = document.querySelector('input[name="class"]:checked').value;

            // Here, you can store the values if needed (example using sessionStorage)

            sessionStorage.setItem("destinationLocation", dname);
